name: Flutter CI

on:
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: Run Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform=android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/komikuy-armeabi-v7a-release.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   build/app/outputs/flutter-apk/komikuy-arm64-v8a-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komikuy-apks
          path: |
            build/app/outputs/flutter-apk/komikuy-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/komikuy-arm64-v8a-release.apk
