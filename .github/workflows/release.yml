name: Flutter Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (hanya ARM architectures)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform=android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/komikuy-armeabi-v7a-release.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   build/app/outputs/flutter-apk/komikuy-arm64-v8a-release.apk

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev ruby ruby-dev build-essential rpm
          sudo gem install fpm

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Deb and RPM packages
        run: |
          VERSION=$(grep -E "^version: " pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)

          # Prepare directory structure
          mkdir -p build/linux_packaging/opt/komikuy
          mkdir -p build/linux_packaging/usr/share/applications
          mkdir -p build/linux_packaging/usr/share/icons/hicolor/256x256/apps

          # Copy app bundle
          cp -r build/linux/x64/release/bundle/* build/linux_packaging/opt/komikuy/

          # Copy desktop file and icon
          cp linux/packaging/komikuy.desktop build/linux_packaging/usr/share/applications/
          cp assets/logo.png build/linux_packaging/usr/share/icons/hicolor/256x256/apps/komikuy.png

          fpm -s dir -t deb -n komikuy -v $VERSION -p komikuy_$VERSION-1_amd64.deb \
            --maintainer "komikuy" \
            -C build/linux_packaging \
            opt/komikuy usr/share/applications usr/share/icons

          fpm -s dir -t rpm -n komikuy -v $VERSION -p komikuy-$VERSION-1.x86_64.rpm \
            --maintainer "komikuy" \
            -C build/linux_packaging \
            opt/komikuy usr/share/applications usr/share/icons

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/komikuy-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/komikuy-arm64-v8a-release.apk
            komikuy_*-1_amd64.deb
            komikuy-*-1.x86_64.rpm
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}

